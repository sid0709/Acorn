<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acorn Interactive Cursor</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        cursor: none !important;
      }

      body {
        min-height: 100vh;
        background: radial-gradient(circle at 50% 50%, #161020 0%, #06040a 100%);
        color: #fff;
        font-family:
          "Inter",
          system-ui,
          -apple-system,
          sans-serif;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        user-select: none;
      }

      .bg-grid {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(rgba(255, 175, 20, 0.08) 1.2px, transparent 1.2px);
        background-size: 36px 36px;
        pointer-events: none;
      }

      /* Canvas for all blurred particles and warm glows */
      #fx-canvas {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 9998;
        mix-blend-mode: screen;
      }

      /* Fixed Origin Container - Only handles position (X, Y) */
      .cursor-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 0;
        height: 0;
        pointer-events: none;
        z-index: 9999;
        will-change: transform;
      }

      /* Centered Inner Body - Handles orientation & scale around exact (0,0) center */
      .cursor-rotator {
        position: absolute;
        top: 0;
        left: 0;
        width: 44px;
        height: 44px;
        margin-left: -22px;
        margin-top: -22px;
        transform-origin: center center;
        will-change: transform;
        filter: drop-shadow(0 0 16px rgba(255, 170, 0, 0.95))
          drop-shadow(0 0 35px rgba(255, 100, 0, 0.65));
        transition: scale 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      /* Soft Core Glow Behind the 'A' */
      .cursor-aura {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 80px;
        height: 80px;
        transform: translate(-50%, -50%);
        background: radial-gradient(
          circle,
          rgba(255, 220, 100, 0.5) 0%,
          rgba(255, 130, 0, 0.25) 45%,
          transparent 70%
        );
        border-radius: 50%;
        filter: blur(10px);
        pointer-events: none;
        animation: pulseAura 2.2s infinite alternate ease-in-out;
      }

      @keyframes pulseAura {
        0% {
          transform: translate(-50%, -50%) scale(0.9);
          opacity: 0.7;
        }
        100% {
          transform: translate(-50%, -50%) scale(1.25);
          opacity: 1;
        }
      }

      /* Acorn 'A' SVG Icon */
      .acorn-svg {
        width: 100%;
        height: 100%;
        display: block;
      }

      /* Interactive Showcase Card */
      .content-box {
        position: relative;
        z-index: 10;
        text-align: center;
        max-width: 620px;
        padding: 44px;
        background: rgba(255, 255, 255, 0.025);
        border: 1px solid rgba(255, 180, 0, 0.18);
        border-radius: 28px;
        backdrop-filter: blur(16px);
        box-shadow:
          0 35px 70px rgba(0, 0, 0, 0.5),
          inset 0 1px 0 rgba(255, 255, 255, 0.15);
      }

      h1 {
        font-size: 3.4rem;
        font-weight: 800;
        letter-spacing: -1.5px;
        margin-bottom: 12px;
        background: linear-gradient(135deg, #ffffff 30%, #ffc043 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      p {
        font-size: 1.05rem;
        color: #a49bb3;
        line-height: 1.6;
        margin-bottom: 30px;
      }

      .interactive-buttons {
        display: flex;
        gap: 16px;
        justify-content: center;
      }

      .btn {
        padding: 14px 28px;
        border-radius: 50px;
        font-weight: 600;
        font-size: 0.95rem;
        border: 1px solid rgba(255, 175, 0, 0.35);
        background: rgba(255, 160, 0, 0.08);
        color: #ffe094;
        transition: all 0.25s ease;
        position: relative;
      }

      .btn:hover {
        background: rgba(255, 175, 0, 0.25);
        border-color: #ffa600;
        color: #fff;
        box-shadow: 0 0 25px rgba(255, 150, 0, 0.45);
        transform: translateY(-2px);
      }

      /* Clean state transitions without displacing the center */
      .cursor-container.hovering .cursor-rotator {
        scale: 1.3;
        filter: drop-shadow(0 0 16px #ffe484) drop-shadow(0 0 28px #ff9d00);
      }

      .cursor-container.clicking .cursor-rotator {
        scale: 0.85;
      }
    </style>
  </head>
  <body>
    <div class="bg-grid"></div>

    <div class="content-box">
      <h1>Glowing <span style="color: #ffae19; -webkit-text-fill-color: #ffae19">A</span>corn</h1>
      <p>
        Move your mouse left and right to see the body turn smoothly with perfect center stability.
      </p>

      <div class="interactive-buttons">
        <button class="btn hover-target">Interactive Area</button>
        <button class="btn hover-target">Smooth Aura</button>
      </div>
    </div>

    <canvas id="fx-canvas"></canvas>

    <!-- Virtual Acorn "A" Cursor -->
    <div class="cursor-container" id="cursor">
      <div class="cursor-rotator" id="cursor-rotator">
        <div class="cursor-aura"></div>
        <svg class="acorn-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="acornGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#ffffff" />
              <stop offset="35%" stop-color="#ffe37a" />
              <stop offset="85%" stop-color="#ff9000" />
              <stop offset="100%" stop-color="#ff4800" />
            </linearGradient>

            <linearGradient id="innerGlow" x1="50%" y1="0%" x2="50%" y2="100%">
              <stop offset="0%" stop-color="rgba(255,255,255,0.9)" />
              <stop offset="100%" stop-color="rgba(255,165,0,0.2)" />
            </linearGradient>
          </defs>

          <!-- Outer organic A outline -->
          <path
            d="M 50 14 
                 C 62 14, 76 36, 83 62 
                 C 89 82, 79 88, 66 84 
                 C 56 80, 53 66, 50 66 
                 C 47 66, 44 80, 34 84 
                 C 21 88, 11 82, 17 62 
                 C 24 36, 38 14, 50 14 Z"
            stroke="url(#acornGrad)"
            stroke-width="7"
            stroke-linecap="round"
            stroke-linejoin="round"
            fill="url(#innerGlow)"
          />

          <!-- Inner swoosh -->
          <path
            d="M 39 63 C 44 51, 56 51, 61 63"
            stroke="url(#acornGrad)"
            stroke-width="6.5"
            stroke-linecap="round"
          />
        </svg>
      </div>
    </div>

    <script>
      const cursor = document.getElementById("cursor");
      const rotator = document.getElementById("cursor-rotator");
      const canvas = document.getElementById("fx-canvas");
      const ctx = canvas.getContext("2d");

      let width = (canvas.width = window.innerWidth);
      let height = (canvas.height = window.innerHeight);

      window.addEventListener("resize", () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      const mouse = { x: width / 2, y: height / 2 };

      // Virtual cursor tracking
      const virtual = {
        x: width / 2,
        y: height / 2,
        vx: 0,
        vy: 0,
        smoothVx: 0, // Low-pass filtered velocity to eliminate micro-jitter
        angle: 0,
      };

      window.addEventListener("mousemove", (e) => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
      });

      // ==========================================
      // Unified Natural Particle System
      // ==========================================
      const particles = [];

      class Particle {
        constructor(x, y, isClick = false) {
          const angle = Math.random() * Math.PI * 2;
          const spread = Math.random() * (isClick ? 14 : 7);
          this.x = x + Math.cos(angle) * spread;
          this.y = y + Math.sin(angle) * spread;

          if (isClick) {
            const speed = Math.random() * 4.2 + 0.8;
            this.vx = Math.cos(angle) * speed;
            this.vy = Math.sin(angle) * speed - 0.4;
            this.size = Math.random() * 4.5 + 2.0;
            this.decay = Math.random() * 0.018 + 0.012;
          } else {
            this.vx = (Math.random() - 0.5) * 2.0;
            this.vy = (Math.random() - 0.5) * 2.0 - 0.5;
            this.size = Math.random() * 3.8 + 1.2;
            this.decay = Math.random() * 0.024 + 0.014;
          }

          this.life = 1.0;
          this.airResistance = 0.96;
          this.gravity = -0.035;

          const colors = ["255, 245, 190", "255, 200, 60", "255, 140, 20", "255, 90, 0"];
          this.color = colors[Math.floor(Math.random() * colors.length)];
        }

        update() {
          this.vx *= this.airResistance;
          this.vy *= this.airResistance;
          this.vy += this.gravity;

          this.x += this.vx;
          this.y += this.vy;

          this.life -= this.decay;
          this.size *= 0.985;
        }

        draw(context) {
          if (this.life <= 0 || this.size <= 0.2) return;

          context.save();
          context.beginPath();
          context.arc(this.x, this.y, Math.max(this.size, 0.1), 0, Math.PI * 2);

          context.shadowColor = `rgba(${this.color}, 0.85)`;
          context.shadowBlur = 12;
          context.fillStyle = `rgba(${this.color}, ${Math.max(this.life * 0.85, 0)})`;
          context.fill();
          context.restore();
        }
      }

      function spawnParticles(x, y, count, isClick = false) {
        for (let i = 0; i < count; i++) {
          if (particles.length < 500) {
            particles.push(new Particle(x, y, isClick));
          }
        }
      }

      window.addEventListener("mousedown", () => {
        cursor.classList.add("clicking");
        spawnParticles(virtual.x, virtual.y, 45, true);
      });

      window.addEventListener("mouseup", () => {
        cursor.classList.remove("clicking");
      });

      document.querySelectorAll(".hover-target").forEach((el) => {
        el.addEventListener("mouseenter", () => cursor.classList.add("hovering"));
        el.addEventListener("mouseleave", () => cursor.classList.remove("hovering"));
      });

      // ==========================================
      // Render & Physics Loop
      // ==========================================
      function animate() {
        const prevX = virtual.x;
        const prevY = virtual.y;

        // 1. Virtual cursor chases mouse
        virtual.x += (mouse.x - virtual.x) * 0.2;
        virtual.y += (mouse.y - virtual.y) * 0.2;

        virtual.vx = virtual.x - prevX;
        virtual.vy = virtual.y - prevY;

        // 2. Filter velocity to eliminate micro-hand-shivering
        virtual.smoothVx += (virtual.vx - virtual.smoothVx) * 0.18;

        // 3. Smooth "Look Left / Look Right" rotation:
        // Sensitive even at low speeds, caps comfortably at ±45 degrees,
        // completely stable with zero center displacement.
        const targetAngle = Math.max(-45, Math.min(45, virtual.smoothVx * 4.2));

        // Critically damped smooth transition back to 0° (upright)
        virtual.angle += (targetAngle - virtual.angle) * 0.12;

        // Outer container locks strictly to virtual (x,y)
        cursor.style.transform = `translate3d(${virtual.x}px, ${virtual.y}px, 0)`;

        // Inner rotator turns around its own exact geometric center
        rotator.style.transform = `rotate(${virtual.angle}deg)`;

        // Particles spawn exactly from virtual cursor center
        const speed = Math.hypot(virtual.vx, virtual.vy);
        if (speed > 0.8) {
          const particleCount = Math.min(Math.floor(speed * 0.85) + 1, 6);
          spawnParticles(virtual.x, virtual.y, particleCount, false);
        }

        // Draw graphics
        ctx.clearRect(0, 0, width, height);

        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.update();
          p.draw(ctx);
          if (p.life <= 0 || p.size <= 0.2) {
            particles.splice(i, 1);
          }
        }

        requestAnimationFrame(animate);
      }

      animate();
    </script>
  </body>
</html>
