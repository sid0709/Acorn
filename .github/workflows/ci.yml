name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # Same checks as `bun run ci` (tools/ci.mjs).
      - run: bun run ci

  api:
    name: API build, vet, and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: acorn-backend/go.mod
          cache-dependency-path: |
            acorn-backend/go.sum
            backend-core/go.sum
      - name: Build
        working-directory: acorn-backend
        run: go build -o /tmp/acorn-api ./cmd/server
      - name: Vet
        working-directory: acorn-backend
        run: go vet ./...
      - name: Test
        working-directory: acorn-backend
        run: go test ./...

  agent:
    name: Agent build, vet, and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: acorn-agent/go.mod
          cache-dependency-path: |
            acorn-backend/go.sum
            backend-core/go.sum
      # The Docker image builds the agent on its own, without the Go workspace.
      - name: Build
        working-directory: acorn-agent
        run: GOWORK=off go build -o /tmp/acorn-agent ./cmd/agent
      - name: Vet
        working-directory: acorn-agent
        run: go vet ./...
      - name: Test
        working-directory: acorn-agent
        run: go test ./...

  web:
    name: Web build and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run --filter acorn-frontend typecheck
      - run: bun run --filter acorn-frontend build

  admin:
    name: Admin build and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run --filter acorn-admin typecheck
      - run: bun run --filter acorn-admin build

  extension:
    name: Extension build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run build:acorn
