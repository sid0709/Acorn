# Build Acorn's API and website images and push them to Docker Hub.
# A push to main, including a merge, also deploys those images on the VPS.
#
# GitHub Environment (Settings → Environments → Production), branch: main.
#
# Required environment secrets:
#   DOCKERHUB_USERNAME  — Docker Hub user that owns the images (omnimuh730)
#   DOCKERHUB_TOKEN     — Docker Hub access token
#   VPS_HOST            — 45.61.176.179
#   VPS_USER            — root
#   VPS_SSH_KEY         — private ed25519 key authorized on the VPS
#
# Optional:
#   VPS_SSH_PORT        — default 22
#   ACORN_API_IMAGE     — environment variable, default omnimuh730/acorn-api
#   ACORN_WEB_IMAGE     — environment variable, default omnimuh730/acorn-web
#
# App secrets stay on the VPS in /opt/acorn/deploy.env. See docker/deploy.env.example.

name: Docker publish

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: acorn-docker-${{ github.ref }}
  cancel-in-progress: false

env:
  API_IMAGE: ${{ vars.ACORN_API_IMAGE || 'omnimuh730/acorn-api' }}
  WEB_IMAGE: ${{ vars.ACORN_WEB_IMAGE || 'omnimuh730/acorn-web' }}

jobs:
  build-and-push:
    name: Build and push
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: Production
    permissions:
      contents: read
    outputs:
      sha_short: ${{ steps.meta.outputs.sha_short }}
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout Acorn
        uses: actions/checkout@v4
        with:
          path: src/Acorn
          submodules: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          SHA_SHORT="$(git -C src/Acorn rev-parse --short HEAD)"
          TAG="sha-${SHA_SHORT}"
          {
            echo "sha_short=${SHA_SHORT}"
            echo "image_tag=${TAG}"
            echo "api_tags<<EOF"
            echo "${API_IMAGE}:${TAG}"
            echo "${API_IMAGE}:latest"
            echo "EOF"
            echo "web_tags<<EOF"
            echo "${WEB_IMAGE}:${TAG}"
            echo "${WEB_IMAGE}:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: src
          file: src/Acorn/acorn-backend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.api_tags }}
          cache-from: type=gha,scope=acorn-api
          cache-to: type=gha,scope=acorn-api,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=acorn-api

      - name: Build and push website
        uses: docker/build-push-action@v6
        with:
          context: src/Acorn
          file: src/Acorn/acorn-frontend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.web_tags }}
          cache-from: type=gha,scope=acorn-web
          cache-to: type=gha,scope=acorn-web,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=acorn-web

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Production
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Prepare deploy directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            set -eu
            install -d -m 700 /opt/acorn

      - name: Sync deploy script
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          source: docker/deploy-remote.sh
          target: /opt/acorn/
          strip_components: 1

      - name: Pull images and recreate containers
        uses: appleboy/ssh-action@v1.2.0
        env:
          ACORN_API_IMAGE: ${{ env.API_IMAGE }}
          ACORN_WEB_IMAGE: ${{ env.WEB_IMAGE }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          envs: ACORN_API_IMAGE,ACORN_WEB_IMAGE,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN
          command_timeout: 20m
          script: |
            set -eu
            printf '%s' "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            chmod 755 /opt/acorn/deploy-remote.sh
            /opt/acorn/deploy-remote.sh "${{ needs.build-and-push.outputs.image_tag }}"
