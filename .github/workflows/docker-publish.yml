# Build Acorn's API, website, admin, and agent images and push them to Docker Hub.
# A push to main, including a merge, deploys only the images whose inputs changed.
# The extension is not an image. An extension-only push does not build or restart containers.
# API inputs: acorn-backend, backend-core.
# Website inputs: acorn-frontend, acorn/extension (packed .zip on Apps), packages, acorn/packages/shared, the root package manifest, and the Bun lockfile.
# Admin inputs: acorn-admin, shared packages (same as the website).
# Agent inputs: acorn-agent, backend-core. The agent plans the extension's Run from screenshots and
# reads each person's profile and Library from the API; it holds no database and no secrets of its own.
# Nginx site files are reference-only; this workflow never installs or overwrites them.
#
# GitHub Environment: Settings → Environments → Production.
#
# Required environment secrets (secrets.*):
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN, VPS_HOST, VPS_USER, VPS_SSH_KEY
# Optional secret: VPS_SSH_PORT (defaults to 22), ACORN_ADMIN_SESSION_SECRET
#
# Environment variables (vars.*):
#   ACORN_API_IMAGE, ACORN_WEB_IMAGE, ACORN_ADMIN_IMAGE, ACORN_AGENT_IMAGE (optional image names)
#   ACORN_ADMIN_USERNAME, ACORN_ADMIN_PWD
#   VITE_ACORN_API_URL, VITE_ACORN_WEB_URL (optional; baked into the extension zip)
#
# If ACORN_ADMIN_SESSION_SECRET is unset, the deploy step generates one on the VPS
# and keeps it in deploy.env.
#
# App secrets stay on the VPS in /opt/acorn/deploy.env. See docker/deploy.env.example.
# Images are tagged with github.sha (and latest). Deploy pulls the SHA tag, not latest.

name: Docker publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_sha:
        description: Existing image tag (full commit SHA) to redeploy without rebuilding
        required: false
        type: string

concurrency:
  group: acorn-docker-${{ github.ref }}
  cancel-in-progress: false

env:
  API_IMAGE: ${{ vars.ACORN_API_IMAGE || 'omnimuh730/acorn-api' }}
  WEB_IMAGE: ${{ vars.ACORN_WEB_IMAGE || 'omnimuh730/acorn-web' }}
  ADMIN_IMAGE: ${{ vars.ACORN_ADMIN_IMAGE || 'omnimuh730/acorn-admin' }}
  AGENT_IMAGE: ${{ vars.ACORN_AGENT_IMAGE || 'omnimuh730/acorn-agent' }}
  PRODUCTION_API_ORIGIN: https://api.acornapply.com
  PRODUCTION_WEB_ORIGIN: https://acornapply.com
  API_HEALTH_URL: https://api.acornapply.com/health
  AGENT_HEALTH_URL: https://api.acornapply.com/agent/v1/health
  HEALTH_ATTEMPTS: "24"
  HEALTH_SLEEP_SEC: "5"

jobs:
  build-and-push:
    name: Build and push
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: Production
    permissions:
      contents: read
    outputs:
      image_tag: ${{ steps.plan.outputs.image_tag }}
      deploy: ${{ steps.plan.outputs.deploy }}
      deploy_api: ${{ steps.plan.outputs.api }}
      deploy_web: ${{ steps.plan.outputs.web }}
      deploy_admin: ${{ steps.plan.outputs.admin }}
      deploy_agent: ${{ steps.plan.outputs.agent }}
      rollback: ${{ steps.plan.outputs.rollback }}

    steps:
      - name: Checkout Acorn
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src/Acorn
          submodules: false

      - name: Choose images
        id: plan
        working-directory: src/Acorn
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
          ROLLBACK_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.image_sha || '' }}
        run: |
          set -euo pipefail
          rollback="$(printf '%s' "${ROLLBACK_SHA:-}" | tr -d '[:space:]')"
          if [[ -n "$rollback" ]]; then
            if [[ ! "$rollback" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "image_sha must be a 40-character commit SHA" >&2
              exit 1
            fi
            rollback="$(printf '%s' "$rollback" | tr 'A-F' 'a-f')"
            echo "Redeploying existing images tagged ${rollback} (no rebuild)."
            echo "image_tag=${rollback}" >> "$GITHUB_OUTPUT"
            echo "api=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "admin=true" >> "$GITHUB_OUTPUT"
            echo "agent=true" >> "$GITHUB_OUTPUT"
            echo "rollback=true" >> "$GITHUB_OUTPUT"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "build=true" >> "$GITHUB_OUTPUT"

          publish_all() {
            echo "api=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "admin=true" >> "$GITHUB_OUTPUT"
            echo "agent=true" >> "$GITHUB_OUTPUT"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          }

          if [[ "$EVENT_NAME" == "workflow_dispatch" || -z "$BEFORE" || "$BEFORE" == 0000000000000000000000000000000000000000 ]]; then
            echo "No previous commit to compare. Building the API, website, admin, and agent."
            publish_all
            exit 0
          fi

          if ! git fetch --depth=1 origin "$BEFORE"; then
            echo "Could not fetch ${BEFORE}. Building the API, website, admin, and agent."
            publish_all
            exit 0
          fi

          echo "Changed paths:"
          git diff --name-only "$BEFORE" HEAD
          images="$(git diff --name-only "$BEFORE" HEAD | bash docker/changed-images.sh)"
          api=false
          web=false
          admin=false
          agent=false
          while IFS= read -r image; do
            case "$image" in
              api) api=true ;;
              web) web=true ;;
              admin) admin=true ;;
              agent) agent=true ;;
            esac
          done <<< "$images"
          echo "api=${api}" >> "$GITHUB_OUTPUT"
          echo "web=${web}" >> "$GITHUB_OUTPUT"
          echo "admin=${admin}" >> "$GITHUB_OUTPUT"
          echo "agent=${agent}" >> "$GITHUB_OUTPUT"
          if [[ "$api" == true || "$web" == true || "$admin" == true || "$agent" == true ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "No API, website, admin, or agent inputs changed. Skipping image builds."
          fi

      - name: Set up Docker Buildx
        if: steps.plan.outputs.build == 'true' && steps.plan.outputs.deploy == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to Docker Hub
        if: steps.plan.outputs.build == 'true' && steps.plan.outputs.deploy == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API
        if: steps.plan.outputs.build == 'true' && steps.plan.outputs.api == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: src/Acorn
          file: src/Acorn/acorn-backend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.API_IMAGE }}:${{ steps.plan.outputs.image_tag }}
            ${{ env.API_IMAGE }}:latest
          cache-from: type=gha,scope=acorn-api
          cache-to: type=gha,scope=acorn-api,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=acorn-api

      - name: Build and push website
        if: steps.plan.outputs.build == 'true' && steps.plan.outputs.web == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: src/Acorn
          file: src/Acorn/acorn-frontend/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            VITE_ACORN_API_URL=${{ vars.VITE_ACORN_API_URL || vars.ACORN_EXTENSION_API_URL || env.PRODUCTION_API_ORIGIN }}
            VITE_ACORN_WEB_URL=${{ vars.VITE_ACORN_WEB_URL || vars.ACORN_EXTENSION_WEB_URL || env.PRODUCTION_WEB_ORIGIN }}
          tags: |
            ${{ env.WEB_IMAGE }}:${{ steps.plan.outputs.image_tag }}
            ${{ env.WEB_IMAGE }}:latest
          cache-from: type=gha,scope=acorn-web
          cache-to: type=gha,scope=acorn-web,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=acorn-web

      - name: Build and push admin
        if: steps.plan.outputs.build == 'true' && steps.plan.outputs.admin == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: src/Acorn
          file: src/Acorn/acorn-admin/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.ADMIN_IMAGE }}:${{ steps.plan.outputs.image_tag }}
            ${{ env.ADMIN_IMAGE }}:latest
          cache-from: type=gha,scope=acorn-admin
          cache-to: type=gha,scope=acorn-admin,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=acorn-admin

      - name: Build and push agent
        if: steps.plan.outputs.build == 'true' && steps.plan.outputs.agent == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: src/Acorn
          file: src/Acorn/acorn-agent/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.AGENT_IMAGE }}:${{ steps.plan.outputs.image_tag }}
            ${{ env.AGENT_IMAGE }}:latest
          cache-from: type=gha,scope=acorn-agent
          cache-to: type=gha,scope=acorn-agent,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=acorn-agent

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    if: needs.build-and-push.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Production
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      - name: Prepare deploy directory
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            set -eu
            install -d -m 700 /opt/acorn

      - name: Sync deploy scripts
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          source: "docker/deploy-remote.sh,docker/sync-deploy-env.sh"
          target: /opt/acorn/
          strip_components: 1

      - name: Sync admin credentials to deploy.env
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          ACORN_ADMIN_USERNAME: ${{ vars.ACORN_ADMIN_USERNAME }}
          ACORN_ADMIN_PWD: ${{ vars.ACORN_ADMIN_PWD }}
          ACORN_ADMIN_SESSION_SECRET: ${{ secrets.ACORN_ADMIN_SESSION_SECRET }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          envs: ACORN_ADMIN_USERNAME,ACORN_ADMIN_PWD,ACORN_ADMIN_SESSION_SECRET
          script: |
            set -eu
            chmod 755 /opt/acorn/sync-deploy-env.sh
            /opt/acorn/sync-deploy-env.sh

      - name: Pull images and recreate containers
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          ACORN_API_IMAGE: ${{ env.API_IMAGE }}
          ACORN_WEB_IMAGE: ${{ env.WEB_IMAGE }}
          ACORN_ADMIN_IMAGE: ${{ env.ADMIN_IMAGE }}
          ACORN_AGENT_IMAGE: ${{ env.AGENT_IMAGE }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          DEPLOY_API: ${{ needs.build-and-push.outputs.deploy_api }}
          DEPLOY_WEB: ${{ needs.build-and-push.outputs.deploy_web }}
          DEPLOY_ADMIN: ${{ needs.build-and-push.outputs.deploy_admin }}
          DEPLOY_AGENT: ${{ needs.build-and-push.outputs.deploy_agent }}
          # A rollback to a commit from before the agent existed has no agent image to pull.
          AGENT_PULL_OPTIONAL: ${{ needs.build-and-push.outputs.rollback == 'true' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          envs: ACORN_API_IMAGE,ACORN_WEB_IMAGE,ACORN_ADMIN_IMAGE,ACORN_AGENT_IMAGE,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,IMAGE_TAG,DEPLOY_API,DEPLOY_WEB,DEPLOY_ADMIN,DEPLOY_AGENT,AGENT_PULL_OPTIONAL
          command_timeout: 20m
          script: |
            set -eu
            printf '%s' "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            chmod 755 /opt/acorn/deploy-remote.sh
            api_recreate_only=false
            if [ -f /tmp/acorn-api-restart-needed ]; then
              rm -f /tmp/acorn-api-restart-needed
              if [ "$DEPLOY_API" != true ]; then
                api_recreate_only=true
              fi
            fi
            services=""
            if [ "$DEPLOY_API" = true ]; then
              services=api
            fi
            if [ "$DEPLOY_WEB" = true ]; then
              if [ -n "$services" ]; then
                services="$services,web"
              else
                services=web
              fi
            fi
            if [ "$DEPLOY_ADMIN" = true ]; then
              if [ -n "$services" ]; then
                services="$services,admin"
              else
                services=admin
              fi
            fi
            if [ "$DEPLOY_AGENT" = true ]; then
              if [ -n "$services" ]; then
                services="$services,agent"
              else
                services=agent
              fi
            fi
            if [ -n "$services" ]; then
              /opt/acorn/deploy-remote.sh "$IMAGE_TAG" "$services"
            fi
            if [ "$api_recreate_only" = true ]; then
              API_RECREATE_ONLY=true /opt/acorn/deploy-remote.sh "$IMAGE_TAG" api
            fi

      - name: Check public API health
        env:
          API_HEALTH_URL: ${{ env.API_HEALTH_URL }}
          HEALTH_ATTEMPTS: ${{ env.HEALTH_ATTEMPTS }}
          HEALTH_SLEEP_SEC: ${{ env.HEALTH_SLEEP_SEC }}
        run: |
          set -euo pipefail
          attempt=1
          while [ "$attempt" -le "$HEALTH_ATTEMPTS" ]; do
            if curl -fsS --max-time 10 "$API_HEALTH_URL"; then
              echo "API healthy at ${API_HEALTH_URL}"
              exit 0
            fi
            echo "Attempt ${attempt}/${HEALTH_ATTEMPTS} failed; retrying in ${HEALTH_SLEEP_SEC}s"
            sleep "$HEALTH_SLEEP_SEC"
            attempt=$((attempt + 1))
          done
          echo "API health check failed: ${API_HEALTH_URL}" >&2
          exit 1

      # The agent is reached from every signed-in extension through its own host. A host that is not
      # set up yet (DNS, TLS, the nginx site) must not fail a deploy of the API: it is a warning, with
      # the container's own health already checked on the VPS by deploy-remote.sh.
      - name: Check public agent health
        if: needs.build-and-push.outputs.deploy_agent == 'true'
        env:
          AGENT_HEALTH_URL: ${{ env.AGENT_HEALTH_URL }}
          HEALTH_ATTEMPTS: ${{ env.HEALTH_ATTEMPTS }}
          HEALTH_SLEEP_SEC: ${{ env.HEALTH_SLEEP_SEC }}
        run: |
          set -uo pipefail
          attempt=1
          while [ "$attempt" -le "$HEALTH_ATTEMPTS" ]; do
            if curl -fsS --max-time 10 "$AGENT_HEALTH_URL"; then
              echo
              echo "Agent healthy at ${AGENT_HEALTH_URL}"
              exit 0
            fi
            echo "Attempt ${attempt}/${HEALTH_ATTEMPTS} failed; retrying in ${HEALTH_SLEEP_SEC}s"
            sleep "$HEALTH_SLEEP_SEC"
            attempt=$((attempt + 1))
          done
          echo "::warning::The agent container is running, but ${AGENT_HEALTH_URL} did not answer. Check the /agent/v1/ block in the api.acornapply.com nginx site (deploy/server-setup.md)."
          exit 0
