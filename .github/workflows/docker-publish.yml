# Build Acorn's API and website images and push them to Docker Hub.
# A push to main, including a merge, deploys only the images whose inputs changed.
# The extension is not an image. An extension-only push does not build or restart containers.
# API inputs: acorn-backend, backend-core.
# Website inputs: acorn-frontend, packages, acorn/packages/shared, the root package manifest, and the Bun lockfile.
#
# GitHub Environment (Settings → Environments → Production), branch: main.
#
# Required environment secrets:
#   DOCKERHUB_USERNAME  — Docker Hub user that owns the images (omnimuh730)
#   DOCKERHUB_TOKEN     — Docker Hub access token
#   VPS_HOST            — 45.61.176.179
#   VPS_USER            — root
#   VPS_SSH_KEY         — private ed25519 key authorized on the VPS
#
# Optional:
#   VPS_SSH_PORT        — default 22
#   ACORN_API_IMAGE     — environment variable, default omnimuh730/acorn-api
#   ACORN_WEB_IMAGE     — environment variable, default omnimuh730/acorn-web
#
# App secrets stay on the VPS in /opt/acorn/deploy.env. See docker/deploy.env.example.

name: Docker publish

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: acorn-docker-${{ github.ref }}
  cancel-in-progress: false

env:
  API_IMAGE: ${{ vars.ACORN_API_IMAGE || 'omnimuh730/acorn-api' }}
  WEB_IMAGE: ${{ vars.ACORN_WEB_IMAGE || 'omnimuh730/acorn-web' }}

jobs:
  build-and-push:
    name: Build and push
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: Production
    permissions:
      contents: read
    outputs:
      image_tag: ${{ steps.plan.outputs.image_tag }}
      deploy: ${{ steps.plan.outputs.deploy }}
      deploy_api: ${{ steps.plan.outputs.api }}
      deploy_web: ${{ steps.plan.outputs.web }}

    steps:
      - name: Checkout Acorn
        uses: actions/checkout@v4
        with:
          path: src/Acorn
          submodules: false

      - name: Choose images
        id: plan
        working-directory: src/Acorn
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          tag="sha-$(git rev-parse --short=12 HEAD)"
          echo "image_tag=${tag}" >> "$GITHUB_OUTPUT"

          publish_both() {
            echo "api=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          }

          if [[ "$EVENT_NAME" == "workflow_dispatch" || -z "$BEFORE" || "$BEFORE" == 0000000000000000000000000000000000000000 ]]; then
            echo "No previous commit to compare. Building the API and the website."
            publish_both
            exit 0
          fi

          if ! git fetch --depth=1 origin "$BEFORE"; then
            echo "Could not fetch ${BEFORE}. Building the API and the website."
            publish_both
            exit 0
          fi

          echo "Changed paths:"
          git diff --name-only "$BEFORE" HEAD
          images="$(git diff --name-only "$BEFORE" HEAD | bash docker/changed-images.sh)"
          api=false
          web=false
          while IFS= read -r image; do
            case "$image" in
              api) api=true ;;
              web) web=true ;;
            esac
          done <<< "$images"
          echo "api=${api}" >> "$GITHUB_OUTPUT"
          echo "web=${web}" >> "$GITHUB_OUTPUT"
          if [[ "$api" == true || "$web" == true ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "No API or website inputs changed. Skipping image builds."
          fi

      - name: Set up Docker Buildx
        if: steps.plan.outputs.deploy == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.plan.outputs.deploy == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API
        if: steps.plan.outputs.api == 'true'
        uses: docker/build-push-action@v6
        with:
          context: src/Acorn
          file: src/Acorn/acorn-backend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.API_IMAGE }}:${{ steps.plan.outputs.image_tag }}
            ${{ env.API_IMAGE }}:latest
          cache-from: type=gha,scope=acorn-api
          cache-to: type=gha,scope=acorn-api,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=acorn-api

      - name: Build and push website
        if: steps.plan.outputs.web == 'true'
        uses: docker/build-push-action@v6
        with:
          context: src/Acorn
          file: src/Acorn/acorn-frontend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.WEB_IMAGE }}:${{ steps.plan.outputs.image_tag }}
            ${{ env.WEB_IMAGE }}:latest
          cache-from: type=gha,scope=acorn-web
          cache-to: type=gha,scope=acorn-web,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=acorn-web

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    if: needs.build-and-push.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Production
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Prepare deploy directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            set -eu
            install -d -m 700 /opt/acorn

      - name: Sync deploy script
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          source: docker/deploy-remote.sh
          target: /opt/acorn/
          strip_components: 1

      - name: Pull images and recreate containers
        uses: appleboy/ssh-action@v1.2.0
        env:
          ACORN_API_IMAGE: ${{ env.API_IMAGE }}
          ACORN_WEB_IMAGE: ${{ env.WEB_IMAGE }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          DEPLOY_API: ${{ needs.build-and-push.outputs.deploy_api }}
          DEPLOY_WEB: ${{ needs.build-and-push.outputs.deploy_web }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          envs: ACORN_API_IMAGE,ACORN_WEB_IMAGE,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,IMAGE_TAG,DEPLOY_API,DEPLOY_WEB
          command_timeout: 20m
          script: |
            set -eu
            printf '%s' "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            chmod 755 /opt/acorn/deploy-remote.sh
            services=""
            if [ "$DEPLOY_API" = true ]; then
              services=api
            fi
            if [ "$DEPLOY_WEB" = true ]; then
              if [ -n "$services" ]; then
                services="$services,web"
              else
                services=web
              fi
            fi
            /opt/acorn/deploy-remote.sh "$IMAGE_TAG" "$services"
