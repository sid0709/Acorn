# Reference only. admin.acornapply.com → acorn-admin on 127.0.0.1:6011.
# CI does not install or overwrite any Nginx site file.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.acornapply.com;

    client_max_body_size 40m;
    include snippets/acorn-security-headers.conf;

    # Optional staff allowlist. Copy snippets/acorn-admin-allowlist.conf into
    # /etc/nginx/snippets/, add office or VPN sources, then uncomment:
    # include snippets/acorn-admin-allowlist.conf;

    location /.well-known/acme-challenge/ {
        allow all;
        root /var/www/html;
    }

    location / {
        limit_req zone=acorn_admin burst=10 nodelay;
        include snippets/acorn-proxy.conf;
        proxy_pass http://127.0.0.1:6011;
    }

    ssl_certificate /etc/letsencrypt/live/admin.acornapply.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.acornapply.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name admin.acornapply.com;

    location /.well-known/acme-challenge/ {
        allow all;
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
