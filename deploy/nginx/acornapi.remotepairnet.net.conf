# acornapi.remotepairnet.net → acorn-backend on 127.0.0.1:8083.
# The website stays on acorn.remotepairnet.net. Other vhosts are untouched.
# Websocket upgrades use the map defined for acorn.remotepairnet.net.

server {
    server_name acornapi.remotepairnet.net;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_acorn;
        proxy_read_timeout 1h;
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/acornapi.remotepairnet.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/acornapi.remotepairnet.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = acornapi.remotepairnet.net) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name acornapi.remotepairnet.net;
    return 404;
}
