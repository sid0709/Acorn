# acorn.remotepairnet.net only. Other sites on this host are separate files.
#
# acorn-frontend listens on 127.0.0.1:6005.
# acorn-backend listens on 127.0.0.1:8083.
# Google sends the browser to the frontend at /auth/google/callback.
# The extension calls /acorn on this host, including /acorn/socket.io.

map $http_upgrade $connection_upgrade_acorn {
    default upgrade;
    ''      close;
}

server {
    server_name acorn.remotepairnet.net;

    client_max_body_size 20m;

    location /acorn {
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_acorn;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:6005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_acorn;
    }

    error_page 502 503 504 /starting.html;
    location = /starting.html {
        root /var/www/acorn;
        internal;
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/acorn.remotepairnet.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/acorn.remotepairnet.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = acorn.remotepairnet.net) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name acorn.remotepairnet.net;
    return 404;
}
