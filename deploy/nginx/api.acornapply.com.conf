# Reference only. api.acornapply.com → acorn-backend on 127.0.0.1:8083, /agent/v1/ → acorn-agent
# on 127.0.0.1:8093, and /api/oak/ + /oak/ → oak-backend on 127.0.0.1:8094 (the same host, split by path;
# the agent and Oak reach the API privately over Docker).
# WebSocket upgrades use $connection_upgrade from conf.d/acorn-common.conf.
# CI does not install or overwrite any Nginx site file.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.acornapply.com;

    client_max_body_size 40m;
    include snippets/acorn-security-headers.conf;

    location /.well-known/acme-challenge/ {
        allow all;
        root /var/www/html;
    }

    location /acorn/socket.io {
        limit_req zone=acorn_api burst=40 nodelay;
        include snippets/acorn-proxy.conf;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_pass http://127.0.0.1:8083;
    }

    # The extension's Run sends each screenshot here and gets the next actions back. A step waits
    # for the model (minutes at most), and a survey of a long page is several screenshots at once.
    location /agent/v1/ {
        limit_req zone=acorn_agent burst=40 nodelay;
        client_max_body_size 40m;
        include snippets/acorn-proxy.conf;
        # The agent answers a step within stepTimeout (5 minutes), including its model retries.
        proxy_read_timeout 6m;
        proxy_send_timeout 6m;
        proxy_pass http://127.0.0.1:8093;
    }

    # Gmail's push notifications arrive here from Google Cloud Pub/Sub (a push subscription). The handler
    # checks Google's signed token itself. A burst of notifications must not be refused (Pub/Sub would
    # only retry), so this block has a wider burst than the rest of the API.
    location = /acorn/gmail/push {
        limit_req zone=acorn_api burst=200 nodelay;
        include snippets/acorn-proxy.conf;
        proxy_pass http://127.0.0.1:8083;
    }

    # Oak, the Oak extension's API: plain HTTP under /api/oak/ (a page's DOM tree and the Sent screenshot
    # are the large bodies) and its Socket.io relay at /oak/ (WebSocket upgrades, long polling).
    location /api/oak/ {
        limit_req zone=acorn_oak burst=40 nodelay;
        client_max_body_size 50m;
        include snippets/acorn-proxy.conf;
        # A page's plan waits for the model, and a Jev recommend for a long posting.
        proxy_read_timeout 2m;
        proxy_send_timeout 2m;
        proxy_pass http://127.0.0.1:8094;
    }

    location /oak/ {
        limit_req zone=acorn_oak burst=40 nodelay;
        include snippets/acorn-proxy.conf;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_pass http://127.0.0.1:8094;
    }

    location / {
        limit_req zone=acorn_api burst=20 nodelay;
        include snippets/acorn-proxy.conf;
        proxy_read_timeout 1h;
        proxy_pass http://127.0.0.1:8083;
    }

    ssl_certificate /etc/letsencrypt/live/api.acornapply.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.acornapply.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.acornapply.com;

    location /.well-known/acme-challenge/ {
        allow all;
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
