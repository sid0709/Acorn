# Reference only. api.acornapply.com → acorn-backend on 127.0.0.1:8083.
# WebSocket upgrades use $connection_upgrade from conf.d/acorn-common.conf.
# CI does not install or overwrite any Nginx site file.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.acornapply.com;

    client_max_body_size 40m;
    include snippets/acorn-security-headers.conf;

    location /.well-known/acme-challenge/ {
        allow all;
        root /var/www/html;
    }

    location /acorn/socket.io {
        limit_req zone=acorn_api burst=40 nodelay;
        include snippets/acorn-proxy.conf;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_pass http://127.0.0.1:8083;
    }

    location / {
        limit_req zone=acorn_api burst=20 nodelay;
        include snippets/acorn-proxy.conf;
        proxy_read_timeout 1h;
        proxy_pass http://127.0.0.1:8083;
    }

    ssl_certificate /etc/letsencrypt/live/api.acornapply.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.acornapply.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.acornapply.com;

    location /.well-known/acme-challenge/ {
        allow all;
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
