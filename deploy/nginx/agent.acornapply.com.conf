# Reference only. agent.acornapply.com → acorn-agent on 127.0.0.1:8090.
# The extension's Run sends each screenshot here and gets the next actions back. A step waits for the
# model (minutes at most), a survey sends a few screenshots at once, and nothing is a WebSocket.
# CI does not install or overwrite any Nginx site file.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name agent.acornapply.com;

    # A survey of a long page is several screenshots in one request.
    client_max_body_size 40m;
    include snippets/acorn-security-headers.conf;

    location /.well-known/acme-challenge/ {
        allow all;
        root /var/www/html;
    }

    location / {
        limit_req zone=acorn_agent burst=40 nodelay;
        include snippets/acorn-proxy.conf;
        # The agent answers a step within stepTimeout (5 minutes), including its model retries.
        proxy_read_timeout 6m;
        proxy_send_timeout 6m;
        proxy_pass http://127.0.0.1:8090;
    }

    ssl_certificate /etc/letsencrypt/live/agent.acornapply.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agent.acornapply.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name agent.acornapply.com;

    location /.well-known/acme-challenge/ {
        allow all;
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
