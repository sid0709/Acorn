# Reference only. Lives on the VPS as /etc/nginx/conf.d/acorn-common.conf.
# CI does not install or overwrite this file.
#
# $connection_upgrade is shared by every Acorn site. limit_req_zone must sit
# in the http{} context (conf.d), not in a server block.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

limit_req_zone $binary_remote_addr zone=acorn_web:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=acorn_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=acorn_admin:10m rate=5r/s;

server_tokens off;
