# Reference only. Apex and www → acorn-frontend on 127.0.0.1:6005.
# The VPS already has /etc/nginx/sites-available/acornapply.com.
# CI does not install or overwrite any Nginx site file.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name acornapply.com www.acornapply.com;

    client_max_body_size 40m;
    include snippets/acorn-security-headers.conf;

    location /.well-known/acme-challenge/ {
        allow all;
        root /var/www/html;
    }

    location / {
        limit_req zone=acorn_web burst=20 nodelay;
        include snippets/acorn-proxy.conf;
        proxy_pass http://127.0.0.1:6005;
    }

    ssl_certificate /etc/letsencrypt/live/acornapply.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/acornapply.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name acornapply.com www.acornapply.com;

    location /.well-known/acme-challenge/ {
        allow all;
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
