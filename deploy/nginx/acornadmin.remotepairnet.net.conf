# acornadmin.remotepairnet.net → acorn-admin on 127.0.0.1:6011.
# JoinedHQ admin already uses 127.0.0.1:6010 on this host.
# Websocket upgrades reuse the map in acorn.remotepairnet.net ($connection_upgrade_acorn).

server {
    server_name acornadmin.remotepairnet.net;

    client_max_body_size 10m;

    location /.well-known/acme-challenge/ {
        allow all;
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:6011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_acorn;
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/acornadmin.remotepairnet.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/acornadmin.remotepairnet.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = acornadmin.remotepairnet.net) {
        return 301 https://$host$request_uri;
    }

    server_name acornadmin.remotepairnet.net;

    listen 80;
    listen [::]:80;
    return 404;
}
